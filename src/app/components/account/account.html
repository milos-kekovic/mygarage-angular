<p>Account balance: {{ balance() }}€</p>

<button [disabled]="isLoading()" (click)="depositRequest.emit()">
    Deposit 100€
</button>

<button
    [disabled]="!canWithdraw() || isLoading()"
    (click)="withdrawRequest.emit()"
>
    Withdraw 100€
</button>

@if (error()) {
  <p class="error-message">{{ error() }}</p>
}

@if (isLoading()) {
  <p>Processing transaction...</p>
}
